server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Re-resolve `server` every 10s so a restarted
    # container (which gets a NEW IP) doesn't leave nginx stuck on a dead
    # address — the cause of "connect() failed (113: Host is unreachable)".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy /api/* → server:3001/* (strips the /api prefix).
    # Using a variable for the upstream forces per-request DNS resolution
    # instead of caching the IP once at startup.
    location /api/ {
        set $upstream http://server:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
