import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localProps.load(localPropsFile.newInputStream())

android {
    namespace 'com.imvj.cardledger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imvj.cardledger'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"https://cards.imvj.host/api/"'
            buildConfigField 'String', 'GOOGLE_CLIENT_ID', "\"${localProps.getProperty('GOOGLE_CLIENT_ID', '930171661547-sbbprura1lgdhbrs8m3eipqvqrt9r5sa.apps.googleusercontent.com')}\""
        }
        release {
            minifyEnabled true
            // Without this, R8 strips unused code but every drawable/string/layout from every
            // dependency still ships. Requires minifyEnabled, which is already on.
            shrinkResources true
            buildConfigField 'String', 'API_BASE_URL', '"https://cards.imvj.host/api/"'
            buildConfigField 'String', 'GOOGLE_CLIENT_ID', "\"${localProps.getProperty('GOOGLE_CLIENT_ID', '')}\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures { compose = true; buildConfig = true }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.credentials:credentials:1.3.0-rc01'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0-rc01'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
