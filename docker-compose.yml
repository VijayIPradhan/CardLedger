services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardledger}
      POSTGRES_DB: ${POSTGRES_DB:-cardledger}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardledger} && psql -U ${POSTGRES_USER:-cardledger} -d ${POSTGRES_DB:-cardledger} -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    networks:
      dokploy-network:
        # Unique alias — the bare name `postgres` collides with other stacks
        # on the shared external dokploy-network, causing the pool to round-robin
        # into a foreign database (intermittent 28P01 auth failures).
        aliases:
          - cardledger-postgres

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cardledger}:${POSTGRES_PASSWORD:-cardledger}@cardledger-postgres:5432/${POSTGRES_DB:-cardledger}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      PORT: 3001
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-changeme123}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network
      
  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    ports:
      - "${APP_PORT:-3007}:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
