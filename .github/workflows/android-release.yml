name: Build Android APK & Release

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Release name to attach APKs (e.g. v1.0.0). Leave blank to only upload as workflow artifacts.'
        required: false
        type: string
      build_type:
        description: 'Which APKs to build?'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Upload to Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions to gradlew
        run: chmod +x ./gradlew
        working-directory: packages/android-native

      - name: Create local.properties
        working-directory: packages/android-native
        run: |
          touch local.properties
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> local.properties
          fi

      - name: Create placeholder google-services.json
        working-directory: packages/android-native/app
        run: |
          cat > google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "cardledger-placeholder",
              "storage_bucket": "cardledger-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.imvj.cardledger"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPurposesOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch'
        working-directory: packages/android-native
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - name: Build Release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch'
        working-directory: packages/android-native
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      - name: Check Keystore Secret Presence
        id: check_keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign Release APK (Optional)
        if: (inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch') && steps.check_keystore.outputs.has_keystore == 'true'
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: packages/android-native/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK files for Upload
        run: |
          mkdir -p apks-to-release
          if [ -f packages/android-native/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp packages/android-native/app/build/outputs/apk/debug/app-debug.apk apks-to-release/CardLedger-debug.apk
          fi
          if [ -f packages/android-native/app/build/outputs/apk/release/app-release.apk ]; then
            cp packages/android-native/app/build/outputs/apk/release/app-release.apk apks-to-release/CardLedger-release.apk
          elif [ -f packages/android-native/app/build/outputs/apk/release/app-release-unsigned-signed.apk ]; then
            cp packages/android-native/app/build/outputs/apk/release/app-release-unsigned-signed.apk apks-to-release/CardLedger-release.apk
          elif [ -f packages/android-native/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp packages/android-native/app/build/outputs/apk/release/app-release-unsigned.apk apks-to-release/CardLedger-release-unsigned.apk
          fi
          ls -lh apks-to-release/

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardLedger-APKs-${{ github.sha }}
          path: apks-to-release/*.apk
          retention-days: 30

      # Which GitHub Release (if any) this run publishes to:
      #   push to main      -> a new release android-v1.0.<run number>, marked latest
      #   tag v* / release  -> that tag
      #   manual run        -> the tag_name input, or none if left blank
      - name: Decide Release Tag
        id: release_tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tag="android-v1.0.${{ github.run_number }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-<none, artifacts only>}"

      # Only installable APKs go on a release: Android refuses unsigned ones, so an unsigned
      # release build stays in the workflow artifacts only.
      - name: Select APKs for Release
        if: steps.release_tag.outputs.tag != ''
        id: release_files
        run: |
          mkdir -p apks-for-release
          [ -f apks-to-release/CardLedger-debug.apk ] && cp apks-to-release/CardLedger-debug.apk apks-for-release/
          [ -f apks-to-release/CardLedger-release.apk ] && cp apks-to-release/CardLedger-release.apk apks-for-release/
          if [ -f apks-for-release/CardLedger-release.apk ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh apks-for-release/

      - name: Upload APKs to GitHub Release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CardLedger Android ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: apks-for-release/*.apk
          body: |
            Built from ${{ github.sha }} (version code ${{ github.run_number }}).

            ${{ steps.release_files.outputs.signed == 'true' && 'Install **CardLedger-release.apk**.' || 'Install **CardLedger-debug.apk**. No signing key is configured, so there is no installable release build; add the KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD and KEY_PASSWORD secrets to get one.' }}
