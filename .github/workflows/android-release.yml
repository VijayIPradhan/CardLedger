name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Release name to attach APKs (e.g. v1.0.0). Leave blank to only upload as workflow artifacts.'
        required: false
        type: string
      build_type:
        description: 'Which APKs to build?'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Upload to Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions to gradlew
        run: chmod +x ./gradlew
        working-directory: packages/android-native

      - name: Create local.properties
        working-directory: packages/android-native
        run: |
          touch local.properties
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> local.properties
          fi

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        working-directory: packages/android-native
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        working-directory: packages/android-native
        run: ./gradlew assembleRelease

      - name: Sign Release APK (Optional)
        if: ${{ (inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch') && secrets.KEYSTORE_BASE64 != '' }}
        id: sign_apk
        uses: r0adkll/sign-android-release@v3
        with:
          releaseDirectory: packages/android-native/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK files for Upload
        run: |
          mkdir -p apks-to-release
          if [ -f packages/android-native/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp packages/android-native/app/build/outputs/apk/debug/app-debug.apk apks-to-release/CardLedger-debug.apk
          fi
          if [ -f packages/android-native/app/build/outputs/apk/release/app-release.apk ]; then
            cp packages/android-native/app/build/outputs/apk/release/app-release.apk apks-to-release/CardLedger-release.apk
          elif [ -f packages/android-native/app/build/outputs/apk/release/app-release-unsigned-signed.apk ]; then
            cp packages/android-native/app/build/outputs/apk/release/app-release-unsigned-signed.apk apks-to-release/CardLedger-release.apk
          elif [ -f packages/android-native/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp packages/android-native/app/build/outputs/apk/release/app-release-unsigned.apk apks-to-release/CardLedger-release-unsigned.apk
          fi
          ls -lh apks-to-release/

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardLedger-APKs-${{ github.sha }}
          path: apks-to-release/*.apk
          retention-days: 30

      - name: Upload APKs to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: apks-to-release/*.apk
